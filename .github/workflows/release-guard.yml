name: Release guard

# Страховка на случай, если релиз опубликовали вручную, в обход scripts/release.sh.
# Проверяет, что к релизу приложен full-APK и что внутри него реально есть ядро
# sing-box. Предыстория — docs/HANDOFF.md, «Честные оговорки» (0.6.0).

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза для проверки (например v0.6.0)"
        required: true

jobs:
  verify-release-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Проверить состав ассетов
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          assets="$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name')"
          echo "Ассеты релиза $TAG:"; echo "$assets" | sed 's/^/  /'

          full="$(echo "$assets" | grep -E '^Hydra-full-.*\.apk$' | head -1 || true)"
          if [ -z "$full" ]; then
            echo "::error::В релизе $TAG нет full-APK (Hydra-full-*.apk). Stub-сборка — не рабочее приложение, в ней соединение симулируется. Выпускайте релиз через scripts/release.sh."
            exit 1
          fi
          echo "FULL_APK=$full" >> "$GITHUB_ENV"

          # С 0.6.25 релиз — все платформы (см. release.yml). Старые теги не трогаем.
          v="${TAG#v}"
          if [ "$(printf '%s\n0.6.25\n' "$v" | sort -V | head -1)" = "0.6.25" ]; then
            for p in "windows-x64.msi" "windows-x64.exe" "windows-x64-portable.zip" \
                     "linux-x64.deb" "linux-x64.rpm" "linux-x64.AppImage" "linux-x64.tar.gz" \
                     "linux-arm64.deb" "linux-arm64.rpm" "linux-arm64.AppImage" "linux-arm64.tar.gz" \
                     "macos-arm64.dmg" "macos-x64.dmg"; do
              echo "$assets" | grep -qxF "Hydra-desktop-$v-$p" \
                || { echo "::error::В релизе $TAG нет Hydra-desktop-$v-$p. Релиз публикует release.yml после сборки всех платформ."; exit 1; }
            done
            echo "$assets" | grep -qxF "Hydra-ios-$v-unsigned.ipa" || { echo "::error::нет Hydra-ios-$v-unsigned.ipa"; exit 1; }
          fi

      - name: Проверить, что внутри full-APK есть ядро sing-box
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$REPO" --pattern "$FULL_APK" --dir /tmp/rg
          so="$(unzip -l "/tmp/rg/$FULL_APK" | awk '{print $NF}' | grep -E '^lib/[^/]+/libbox\.so$' || true)"
          if [ -z "$so" ]; then
            echo "::error::В $FULL_APK нет lib/*/libbox.so — приложение не сможет поднять туннель. Пересоберите через scripts/release.sh."
            exit 1
          fi
          echo "Ядро на месте:"; echo "$so" | sed 's/^/  /'
