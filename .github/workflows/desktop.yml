name: Desktop CI

# Hydra Desktop (Windows / Linux / macOS). На каждом раннере:
#   1) юнит-тесты + рендер всех экранов (:desktop:test);
#   2) `sing-box check` каждого сгенерированного конфига и `xray run -test` конфигов Xray;
#   3) сквозная проверка реального трафика (scripts/desktop-e2e.sh): режим PROXY и
#      режим TUN (на раннерах есть sudo / администратор), движки sing-box и Xray;
#   4) при package=true — пакеты (scripts/package-desktop.sh) + дымовой запуск,
#      выкладываются артефактом. Так вызывает release.yml.

on:
  push:
    branches: [ master, main ]
    paths: [ 'desktop/**', 'shared/**', 'scripts/desktop-e2e.sh', 'scripts/package-desktop.sh', '.github/workflows/desktop.yml', 'settings.gradle.kts', 'build.gradle.kts' ]
  pull_request:
    paths: [ 'desktop/**', 'shared/**', 'scripts/desktop-e2e.sh', 'scripts/package-desktop.sh', '.github/workflows/desktop.yml' ]
  workflow_dispatch:
    inputs:
      package:
        description: "Собрать пакеты"
        type: boolean
        default: true
  workflow_call:
    inputs:
      package:
        type: boolean
        default: true

# Приватный DNS Hydra VPN (секрет репозитория): нужен сборке, в исходниках его нет. Пусто — пункт DNS скрыт.
env:
  HYDRA_PRIVATE_DNS: ${{ secrets.HYDRA_PRIVATE_DNS }}

jobs:
  desktop:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: windows-x64, runner: windows-latest,   os: windows }
          - { target: linux-x64,   runner: ubuntu-24.04,     os: linux }
          - { target: linux-arm64, runner: ubuntu-24.04-arm, os: linux }
          - { target: macos-arm64, runner: macos-15,         os: macos }
          - { target: macos-x64,   runner: macos-15-intel,   os: macos }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Linux-пакеты для сборки и дымового теста
        if: matrix.os == 'linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q fakeroot rpm xvfb libfuse2t64 || sudo apt-get install -y -q fakeroot rpm xvfb

      # olcRTC собирается из закреплённого коммита (чистый Go, версия — по go.mod апстрима).
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Тесты (конфиги, парсеры, хранилище, рендер UI)
        run: gradle :desktop:downloadSingBox :desktop:downloadXray :desktop:downloadOpenFlux :desktop:buildOlcRtc :desktop:test --stacktrace

      - name: sing-box check каждого конфига
        run: |
          set -euo pipefail
          core="$(ls desktop/build/hydra-app-resources/${{ matrix.target }}/sing-box* | head -1)"
          "$core" version | sed -n 1p
          n=0
          for c in desktop/build/singbox-configs/*.json; do
            "$core" check -c "$c" || { echo "::error::sing-box check: $c"; exit 1; }
            n=$((n+1))
          done
          echo "проверено конфигов: $n"

      - name: xray run -test каждого конфига Xray
        run: |
          set -euo pipefail
          xray="$(ls desktop/build/hydra-app-resources/${{ matrix.target }}/xray* | head -1)"
          "$xray" version | sed -n 1p
          n=0
          for c in desktop/build/xray-configs/*.json; do
            "$xray" run -test -c "$c" > /dev/null || { echo "::error::xray -test: $c"; "$xray" run -test -c "$c" || true; exit 1; }
            n=$((n+1))
          done
          echo "проверено конфигов Xray: $n"

      - name: Сквозная проверка трафика (PROXY + TUN)
        run: |
          core="$(ls desktop/build/hydra-app-resources/${{ matrix.target }}/sing-box* | head -1)"
          xray="$(ls desktop/build/hydra-app-resources/${{ matrix.target }}/xray* | head -1)"
          openflux="$(ls desktop/build/hydra-app-resources/${{ matrix.target }}/openflux* | head -1)"
          bash scripts/desktop-e2e.sh "$core" desktop/build/singbox-configs ${{ matrix.os }} all "$xray" "$openflux"

      - name: Пакеты + дымовой запуск
        if: inputs.package
        run: bash scripts/package-desktop.sh ${{ matrix.target }} gradle

      - uses: actions/upload-artifact@v4
        if: inputs.package
        with:
          name: hydra-desktop-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # Hydra Classic (0.7.5): Swing-оболочка для 32-битных систем и Windows 7 — Windows x86/x64, Linux x86/armv7.
  # Архивы собираются на любой ОС (jpackage не нужен), поэтому — один раннер. Проверяется состав архивов и
  # то, что приложение реально запускается (Linux x86, под Xvfb).
  classic:
    name: classic (Windows 7, 32-бит)
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      # Нужен для olcRTC (кросс-сборка из закреплённого коммита; чистый Go).
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - run: sudo apt-get update -q && sudo apt-get install -y -q xvfb file

      - name: Сборка архивов Classic
        run: gradle :desktop:classicDist --stacktrace

      - name: Состав архивов
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' app/build.gradle.kts | sed -n 1p)"
          D=desktop/build/classic/dist
          check() { # архив, обязательные записи (через пробел)
            local f="$D/Hydra-desktop-$VERSION-$1-classic.$2" list
            [ -f "$f" ] || { echo "::error::нет $f"; exit 1; }
            if [ "$2" = zip ]; then list="$(unzip -Z1 "$f")"; else list="$(tar -tzf "$f")"; fi
            for want in ${@:3}; do
              grep -qE "$want" <<<"$list" || { echo "::error::в $1 нет $want"; exit 1; }
            done
            echo "  $1: OK ($(du -h "$f" | cut -f1))"
          }
          check windows-x86 zip 'Hydra/Hydra\.vbs' 'Hydra/jre/bin/javaw\.exe' 'Hydra/resources/sing-box\.exe' 'Hydra/resources/xray\.exe' 'Hydra/resources/olcrtc\.exe' 'Hydra/resources/openflux\.exe' 'Hydra/resources/ciadpi\.exe' 'Hydra/lib/hydra-classic\.jar' 'Hydra/resources/geo/geoip/'
          check windows-x64 zip 'Hydra/Hydra\.vbs' 'Hydra/jre/bin/javaw\.exe' 'Hydra/resources/sing-box\.exe' 'Hydra/resources/xray\.exe' 'Hydra/resources/olcrtc\.exe' 'Hydra/resources/openflux\.exe' 'Hydra/resources/ciadpi\.exe' 'Hydra/lib/hydra-classic\.jar'
          check linux-x86 tar.gz 'Hydra/hydra\.sh' 'Hydra/resources/sing-box$' 'Hydra/resources/xray$' 'Hydra/resources/olcrtc$' 'Hydra/resources/openflux$' 'Hydra/resources/ciadpi$' 'Hydra/lib/hydra-classic\.jar'
          check linux-armv7 tar.gz 'Hydra/hydra\.sh' 'Hydra/resources/sing-box$' 'Hydra/resources/xray$' 'Hydra/resources/olcrtc$' 'Hydra/resources/openflux$' 'Hydra/resources/ciadpi$' 'Hydra/lib/hydra-classic\.jar'

      - name: Архитектура ядер внутри архивов
        run: |
          set -euo pipefail
          B=desktop/build/classic
          expect() { # файл, шаблон вывода file
            out="$(file -b "$1")"; echo "  $1: $out"
            grep -qE "$2" <<<"$out" || { echo "::error::$1: ожидалось $2"; exit 1; }
          }
          expect $B/windows-x86/Hydra/resources/sing-box.exe 'PE32 executable.*Intel 80386'
          expect $B/windows-x86/Hydra/resources/xray.exe 'PE32 executable.*Intel 80386'
          expect $B/windows-x64/Hydra/resources/sing-box.exe 'PE32\+ executable'
          expect $B/linux-x86/Hydra/resources/sing-box 'ELF 32-bit.*Intel 80386'
          expect $B/linux-x86/Hydra/resources/xray 'ELF 32-bit.*Intel 80386'
          expect $B/linux-x86/Hydra/resources/olcrtc 'ELF 32-bit.*Intel 80386'
          expect $B/linux-x86/Hydra/resources/openflux 'ELF 32-bit.*Intel 80386'
          expect $B/linux-x86/Hydra/resources/ciadpi 'ELF 32-bit.*Intel 80386'
          expect $B/windows-x86/Hydra/resources/ciadpi.exe 'PE32 executable.*Intel 80386'
          expect $B/windows-x64/Hydra/resources/ciadpi.exe 'PE32\+ executable'
          expect $B/linux-armv7/Hydra/resources/ciadpi 'ELF 32-bit.*ARM'
          expect $B/windows-x86/Hydra/resources/olcrtc.exe 'PE32 executable.*Intel 80386'
          expect $B/windows-x86/Hydra/resources/openflux.exe 'PE32 executable.*Intel 80386'
          expect $B/windows-x64/Hydra/resources/openflux.exe 'PE32\+ executable'
          expect $B/linux-armv7/Hydra/resources/sing-box 'ELF 32-bit.*ARM'
          expect $B/linux-armv7/Hydra/resources/xray 'ELF 32-bit.*ARM'
          expect $B/linux-armv7/Hydra/resources/olcrtc 'ELF 32-bit.*ARM'
          expect $B/linux-armv7/Hydra/resources/openflux 'ELF 32-bit.*ARM'
          # JRE в Windows-архивах: x86 — 32-битная
          expect $B/windows-x86/Hydra/jre/bin/javaw.exe 'PE32 executable'

      - name: Дымовой запуск Linux x86 (ядро 32-бит, Swing под Xvfb)
        run: |
          set -euo pipefail
          B=desktop/build/classic/linux-x86/Hydra
          "$B/resources/sing-box" version | sed -n 1p      # 32-битный бинарь запускается и на x64-ядре
          "$B/resources/xray" version | sed -n 1p
          home="$(mktemp -d)"; log="$(mktemp)"
          HOME="$home" XDG_CONFIG_HOME="$home/.config" xvfb-run -a "$B/hydra.sh" >"$log" 2>&1 &
          pid=$!
          sleep 20
          if ! kill -0 "$pid" 2>/dev/null; then cat "$log"; echo "::error::Classic завершилась в первые 20 секунд"; exit 1; fi
          pkill -f hydra-classic 2>/dev/null || kill "$pid" 2>/dev/null || true
          grep -iE 'exception|error' "$log" | head -5 || true
          echo "    запуск OK"

      - name: Собрать в dist/
        if: inputs.package
        run: mkdir -p dist && cp desktop/build/classic/dist/* dist/ && ls -la dist

      - uses: actions/upload-artifact@v4
        if: inputs.package
        with:
          name: hydra-desktop-classic
          path: dist/*
          if-no-files-found: error
