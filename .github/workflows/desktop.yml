name: Desktop CI

on:
  push:
    branches: [ master, main ]
    paths:
      - 'desktop/**'
      - 'shared/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'desktop/**'
      - 'shared/**'
      - '.github/workflows/desktop.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
    
    - name: Build shared module
      run: ./gradlew :shared:build --no-daemon
    
    - name: Build desktop module
      run: ./gradlew :desktop:build --no-daemon
    
    - name: Run desktop tests
      run: ./gradlew :desktop:test --no-daemon
    
    - name: Upload desktop JAR
      uses: actions/upload-artifact@v4
      with:
        name: hydravpn-desktop-windows
        path: desktop/build/libs/*.jar

  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
    
    - name: Build shared module
      run: ./gradlew :shared:build --no-daemon
    
    - name: Build desktop module
      run: ./gradlew :desktop:build --no-daemon
    
    - name: Run desktop tests
      run: ./gradlew :desktop:test --no-daemon
    
    - name: Upload desktop JAR
      uses: actions/upload-artifact@v4
      with:
        name: hydravpn-desktop-linux
        path: desktop/build/libs/*.jar

  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
    
    - name: Build shared module
      run: ./gradlew :shared:build --no-daemon
    
    - name: Build desktop module
      run: ./gradlew :desktop:build --no-daemon
    
    - name: Run desktop tests
      run: ./gradlew :desktop:test --no-daemon
    
    - name: Upload desktop JAR
      uses: actions/upload-artifact@v4
      with:
        name: hydravpn-desktop-macos
        path: desktop/build/libs/*.jar