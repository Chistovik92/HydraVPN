name: Desktop CI

# Hydra Desktop (Windows / Linux / macOS). На каждом раннере:
#   1) юнит-тесты + рендер всех экранов (:desktop:test);
#   2) `sing-box check` каждого сгенерированного конфига и `xray run -test` конфигов Xray;
#   3) сквозная проверка реального трафика (scripts/desktop-e2e.sh): режим PROXY и
#      режим TUN (на раннерах есть sudo / администратор), движки sing-box и Xray;
#   4) при package=true — пакеты (scripts/package-desktop.sh) + дымовой запуск,
#      выкладываются артефактом. Так вызывает release.yml.

on:
  push:
    branches: [ master, main ]
    paths: [ 'desktop/**', 'shared/**', 'scripts/desktop-e2e.sh', 'scripts/package-desktop.sh', '.github/workflows/desktop.yml', 'settings.gradle.kts', 'build.gradle.kts' ]
  pull_request:
    paths: [ 'desktop/**', 'shared/**', 'scripts/desktop-e2e.sh', 'scripts/package-desktop.sh', '.github/workflows/desktop.yml' ]
  workflow_dispatch:
    inputs:
      package:
        description: "Собрать пакеты"
        type: boolean
        default: true
  workflow_call:
    inputs:
      package:
        type: boolean
        default: true

# Приватный DNS Hydra VPN (секрет репозитория): нужен сборке, в исходниках его нет. Пусто — пункт DNS скрыт.
env:
  HYDRA_PRIVATE_DNS: ${{ secrets.HYDRA_PRIVATE_DNS }}

jobs:
  desktop:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: windows-x64, runner: windows-latest,   os: windows }
          - { target: linux-x64,   runner: ubuntu-24.04,     os: linux }
          - { target: linux-arm64, runner: ubuntu-24.04-arm, os: linux }
          - { target: macos-arm64, runner: macos-15,         os: macos }
          - { target: macos-x64,   runner: macos-15-intel,   os: macos }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Linux-пакеты для сборки и дымового теста
        if: matrix.os == 'linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q fakeroot rpm xvfb libfuse2t64 || sudo apt-get install -y -q fakeroot rpm xvfb

      # olcRTC собирается из закреплённого коммита (чистый Go, версия — по go.mod апстрима).
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Тесты (конфиги, парсеры, хранилище, рендер UI)
        run: gradle :desktop:downloadSingBox :desktop:downloadXray :desktop:downloadOpenFlux :desktop:buildOlcRtc :desktop:test --stacktrace

      - name: sing-box check каждого конфига
        run: |
          set -euo pipefail
          core="$(ls desktop/build/hydra-app-resources/${{ matrix.target }}/sing-box* | head -1)"
          "$core" version | head -1
          n=0
          for c in desktop/build/singbox-configs/*.json; do
            "$core" check -c "$c" || { echo "::error::sing-box check: $c"; exit 1; }
            n=$((n+1))
          done
          echo "проверено конфигов: $n"

      - name: xray run -test каждого конфига Xray
        run: |
          set -euo pipefail
          xray="$(ls desktop/build/hydra-app-resources/${{ matrix.target }}/xray* | head -1)"
          "$xray" version | head -1
          n=0
          for c in desktop/build/xray-configs/*.json; do
            "$xray" run -test -c "$c" > /dev/null || { echo "::error::xray -test: $c"; "$xray" run -test -c "$c" || true; exit 1; }
            n=$((n+1))
          done
          echo "проверено конфигов Xray: $n"

      - name: Сквозная проверка трафика (PROXY + TUN)
        run: |
          core="$(ls desktop/build/hydra-app-resources/${{ matrix.target }}/sing-box* | head -1)"
          xray="$(ls desktop/build/hydra-app-resources/${{ matrix.target }}/xray* | head -1)"
          bash scripts/desktop-e2e.sh "$core" desktop/build/singbox-configs ${{ matrix.os }} all "$xray"

      - name: Пакеты + дымовой запуск
        if: inputs.package
        run: bash scripts/package-desktop.sh ${{ matrix.target }} gradle

      - uses: actions/upload-artifact@v4
        if: inputs.package
        with:
          name: hydra-desktop-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
