name: iOS CI

# iOS-клиент (Фаза 12). Локально у разработчика нет Mac — компилятор и тесты живут здесь.
on:
  push:
    paths: [ 'ios/**', '.github/workflows/ios.yml', 'app/src/main/res/values*/strings*.xml', 'scripts/android-strings-to-ios.sh' ]
  pull_request:
    paths: [ 'ios/**', '.github/workflows/ios.yml' ]
  workflow_dispatch:
  workflow_call:   # release.yml: неподписанный .ipa в релиз

env:
  # TestFlight: true, когда в репозитории заданы секреты Apple (иначе соответствующие шаги пропускаются).
  HAS_ASC: ${{ secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.ASC_KEY_P8 != '' && secrets.APPLE_TEAM_ID != '' }}
  # Приватный DNS Hydra VPN (секрет репозитория): нужен сборке, в исходниках его нет. Пусто — пункт DNS скрыт.
  HYDRA_PRIVATE_DNS: ${{ secrets.HYDRA_PRIVATE_DNS }}
  SING_BOX_VERSION: "1.12.25"
  AWG_APPLE_COMMIT: "9d5ee60"

jobs:
  # Переносимая логика: парсеры, конфиг sing-box, резервная копия, маска ключей.
  hydrakit:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        run: swift test --package-path ios/Packages/HydraKit

  # Приложение + Network Extension + виджеты. Сборка без подписи: без аккаунта Apple Developer
  # приложение на iPhone не поставить, но компиляция всех трёх таргетов проверяется.
  app:
    runs-on: macos-15
    needs: hydrakit
    steps:
      - uses: actions/checkout@v4
      - name: Restore Libbox.xcframework
        id: libbox
        uses: actions/cache/restore@v4
        with:
          path: ios/Frameworks/Libbox.xcframework
          key: libbox-ios-${{ env.SING_BOX_VERSION }}-bridge-${{ hashFiles('ios/Bridge/go.sum', 'ios/Bridge/**/*.go', 'ios/Bridge/build.sh') }}
      # 0.7.10: Go — по go.mod моста (olcRTC и OpenFlux требуют 1.26).
      - uses: actions/setup-go@v5
        with:
          go-version-file: ios/Bridge/go.mod
          cache: false
      # libbox sing-box + клиенты olcRTC и OpenFlux одной gomobile-сборкой: в расширении VPN два рантайма Go
      # не уживаются, а подпроцессы iOS запрещает (ios/Bridge/build.sh).
      - name: Build Libbox.xcframework (sing-box + olcRTC + OpenFlux, iOS)
        if: steps.libbox.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/ios/Frameworks"
          rm -rf "$GITHUB_WORKSPACE/ios/Frameworks/Libbox.xcframework"
          bash ios/Bridge/build.sh "$GITHUB_WORKSPACE/ios/Frameworks"
      # Сохраняем сразу после сборки (≈10 мин), а не в пост-шаге: иначе упавшая дальше
      # сборка приложения выбрасывала бы готовую xcframework.
      - name: Save Libbox.xcframework
        if: steps.libbox.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ios/Frameworks/Libbox.xcframework
          key: libbox-ios-${{ env.SING_BOX_VERSION }}-bridge-${{ hashFiles('ios/Bridge/go.sum', 'ios/Bridge/**/*.go', 'ios/Bridge/build.sh') }}
      # AmneziaWG: WireGuardKit из amneziawg-apple на зафиксированном коммите + libwg-go.a (amneziawg-go).
      - name: Restore amneziawg-apple
        id: awg
        uses: actions/cache/restore@v4
        with:
          path: ios/Vendor/amneziawg-apple
          key: amneziawg-apple-${{ env.AWG_APPLE_COMMIT }}-ios-v1
      # amneziawg-apple требует Go 1.26 (go.mod). Без явной установки go сам скачивает тулчейн
      # в кэш модулей — только для чтения, и Makefile не может пропатчить скопированный рантайм.
      - uses: actions/setup-go@v5
        if: steps.awg.outputs.cache-hit != 'true'
        with:
          go-version: '1.26.x'
          cache: false
      - name: Build libwg-go.a (amneziawg-go, iOS)
        if: steps.awg.outputs.cache-hit != 'true'
        env:
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          git clone https://github.com/amnezia-vpn/amneziawg-apple ios/Vendor/amneziawg-apple
          git -C ios/Vendor/amneziawg-apple checkout "$AWG_APPLE_COMMIT"
          make -C ios/Vendor/amneziawg-apple/Sources/WireGuardKitGo PLATFORM_NAME=iphoneos ARCHS=arm64 \
            SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)" \
            DEPLOYMENT_TARGET_CLANG_FLAG_NAME=miphoneos-version-min \
            DEPLOYMENT_TARGET_CLANG_ENV_NAME=IPHONEOS_DEPLOYMENT_TARGET IPHONEOS_DEPLOYMENT_TARGET=17.0
          ls -la ios/Vendor/amneziawg-apple/Sources/WireGuardKitGo/out
      - name: Save amneziawg-apple
        if: steps.awg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ios/Vendor/amneziawg-apple
          key: amneziawg-apple-${{ env.AWG_APPLE_COMMIT }}-ios-v1
      - name: Localizations from Android strings
        run: bash scripts/android-strings-to-ios.sh
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate
      - name: Build (unsigned, generic iOS device)
        run: |
          cd ios
          set +e
          xcodebuild -project Hydra.xcodeproj -scheme Hydra -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > build.log 2>&1
          code=$?
          # Все ошибки компилятора целиком (а не хвост лога), затем хвост для контекста.
          grep -E "(error|fatal error):" build.log | sort -u | head -150
          tail -40 build.log
          exit $code
      - name: Unsigned .ipa (для sideload после переподписи)
        run: |
          cd ios/build/Build/Products/Release-iphoneos
          mkdir -p Payload && cp -R Hydra.app Payload/
          zip -qr "$GITHUB_WORKSPACE/Hydra-ios-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: hydra-ios-unsigned
          path: Hydra-ios-unsigned.ipa

      # ---- TestFlight (0.7.11, docs/IOS_TESTING.md) --------------------------------------------------------------
      # Без секретов репозитория (ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, APPLE_TEAM_ID) подпись и выгрузка пропускаются;
      # вместо них проверяются настройки подписи с тестовыми значениями — задача не ломается, когда аккаунта ещё нет.
      - name: TestFlight — проверка настроек подписи (без секретов)
        if: env.HAS_ASC != 'true'
        run: |
          cd ios
          for t in Hydra HydraTunnel HydraAWG HydraWidgets; do
            xcodebuild -project Hydra.xcodeproj -target "$t" -configuration Release -showBuildSettings               DEVELOPMENT_TEAM=ABCDE12345 CURRENT_PROJECT_VERSION=1 CODE_SIGN_STYLE=Automatic > "settings-$t.txt"
            grep -E "^\s+(PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM|CURRENT_PROJECT_VERSION) =" "settings-$t.txt"
            grep -q "DEVELOPMENT_TEAM = ABCDE12345" "settings-$t.txt"
          done
          for p in Hydra HydraTunnel HydraAWG HydraWidgets; do
            /usr/libexec/PlistBuddy -c "Print :ITSAppUsesNonExemptEncryption" "$p/Info.plist"
          done
      - name: TestFlight — подпись и выгрузка
        if: env.HAS_ASC == 'true' && github.event_name != 'pull_request'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          KEY_DIR="$RUNNER_TEMP/asc"; mkdir -p "$KEY_DIR" ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_KEY_P8" > "$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          cp "$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8" ~/.appstoreconnect/private_keys/
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
                -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          cd ios
          # Номер сборки = номер запуска CI: Apple не принимает повторный.
          xcodebuild -project Hydra.xcodeproj -scheme Hydra -configuration Release -destination 'generic/platform=iOS'             -archivePath build/Hydra.xcarchive DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic             CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" "${AUTH[@]}" archive
          sed "s/TEAM_ID/$APPLE_TEAM_ID/" ExportOptions-appstore.plist > build/ExportOptions.plist
          xcodebuild -exportArchive -archivePath build/Hydra.xcarchive -exportPath build/export             -exportOptionsPlist build/ExportOptions.plist "${AUTH[@]}"
          xcrun altool --upload-app -f build/export/Hydra.ipa -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          rm -rf "$KEY_DIR" ~/.appstoreconnect/private_keys
