# Проект Xcode генерируется XcodeGen (`cd ios && xcodegen generate`) — .xcodeproj в git не лежит.
name: Hydra
options:
  bundleIdPrefix: ru.gidravpn
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.6.23"
    CURRENT_PROJECT_VERSION: "36"
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""            # задать свой Team ID для подписи (docs в ios/README.md)
    ENABLE_BITCODE: NO
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  HydraKit:
    path: Packages/HydraKit
  # amneziawg-apple (WireGuardKit + amneziawg-go). Клонируется и собирается в CI / по ios/README.md.
  AmneziaWG:
    path: Vendor/amneziawg-apple

targets:
  Hydra:
    type: application
    platform: iOS
    sources:
      - path: Hydra
      - path: Shared
        excludes: ["IOSStrings/**"]
    dependencies:
      - package: HydraKit
      # счётчики трафика: клиент командного сервера libbox (как в официальном клиенте sing-box)
      - framework: Frameworks/Libbox.xcframework
        embed: false
      - sdk: libresolv.tbd
      - target: HydraTunnel
      - target: HydraWidgets
      - target: HydraAWG
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.gidravpn.hydra
        INFOPLIST_FILE: Hydra/Info.plist
        CODE_SIGN_ENTITLEMENTS: Hydra/Hydra.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"

  HydraTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: HydraTunnel
      # geo-базы sing-box (.srs) — те же файлы, что в Android-ассетах, папками geoip/ и geosite/.
      - path: ../app/src/main/assets/geoip
        type: folder
        buildPhase: resources
      - path: ../app/src/main/assets/geosite
        type: folder
        buildPhase: resources
    dependencies:
      - package: HydraKit
      # gomobile собирает статический фреймворк — встраивать не нужно, только линковать.
      - framework: Frameworks/Libbox.xcframework
        embed: false
      - sdk: libresolv.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.gidravpn.hydra.tunnel
        INFOPLIST_FILE: HydraTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: HydraTunnel/HydraTunnel.entitlements
        OTHER_LDFLAGS: ["-lresolv"]

  HydraWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: HydraWidgets
      - path: Shared
        excludes: ["IOSStrings/**"]
    dependencies:
      - package: HydraKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.gidravpn.hydra.widgets
        INFOPLIST_FILE: HydraWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: HydraWidgets/HydraWidgets.entitlements

  # AmneziaWG — отдельное расширение: amneziawg-go несёт свой Go-рантайм, с Libbox в одном
  # процессе он не уживается. libwg-go.a собирает Makefile из Vendor/amneziawg-apple.
  HydraAWG:
    type: app-extension
    platform: iOS
    sources:
      - path: HydraAWG
    dependencies:
      - package: HydraKit
      - package: AmneziaWG
        product: WireGuardKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.gidravpn.hydra.awg
        INFOPLIST_FILE: HydraAWG/Info.plist
        CODE_SIGN_ENTITLEMENTS: HydraAWG/HydraAWG.entitlements
        LIBRARY_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/Vendor/amneziawg-apple/Sources/WireGuardKitGo/out"]
